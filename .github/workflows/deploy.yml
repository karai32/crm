name: Deploy to TimeWeb

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Upload files to TimeWeb
    runs-on: ubuntu-latest

    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: /crm/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.vscode/**
            **/.claude/**
            **/tests/**
            **/database/**
            **/node_modules/**
            vendor/**
            config/database.php
            config/mail.php
            storage/logs/**
            storage/exports/**
            storage/imports/**
            storage/*.log
